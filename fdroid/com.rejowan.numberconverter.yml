# Builds are added per release. Fill in the tagged commit hash once v1.0.0 is
# tagged — F-Droid requires the exact commit, not the tag name.
Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: FILL_IN_TAGGED_COMMIT_SHA
    subdir: app
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
