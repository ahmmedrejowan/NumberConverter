name: CI

# No paths-ignore: CI runs on every push and PR, including docs-only changes.
# A skipped run leaves a check permanently pending, which is indistinguishable
# from a stuck one — always running keeps the signal honest and costs a few
# minutes on doc edits.
#
# CI is deliberately NOT a required status check on master. It reports; it does
# not gate the merge button.
on:
  push:
    branches: [master, v1]
  pull_request:
    branches: [master, v1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew :app:lint

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Dependency analysis
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > dependencies.txt

      - name: Upload dependency tree
        uses: actions/upload-artifact@v7
        with:
          name: dependencies
          path: dependencies.txt
          retention-days: 7
